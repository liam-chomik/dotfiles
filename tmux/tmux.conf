# ~/.config/tmux/tmux.conf
# tmux configuration. Theme: Gruvbox Material Dark.

# --- Terminal capabilities ---
# tmux only forwards 24-bit colour to applications when the client is known to
# support it. Without the RGB feature the hex values below, and vim's
# termguicolors, are quantized to the 256-colour palette.
#
# hyperlinks carries OSC 8 through to the outer terminal; without it tmux
# strips the escape and only the link text survives.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:hyperlinks"

# --- General behavior ---
set -g mouse on                      # select panes, resize by dragging, scroll natively
set -sg escape-time 10               # drop the ~500ms wait after Esc
set -g history-limit 65536
set -g history-file ~/.tmux_history   # command-prompt history, across server restarts
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on           # closing a window closes the gap in the numbering
set -g focus-events on
set -g status-interval 5             # clock refresh, down from the default 15s
setw -g aggressive-resize on         # size a window to the clients viewing it, not all attached
setw -g monitor-activity on          # flag windows where output appeared while unfocused
set -g set-titles on                 # the outer terminal's tab title follows the active pane
set -g set-titles-string "#T"

# --- Splits open in the current directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle   # switch the active selection to block
# copy-pipe fills the tmux buffer and forwards to the Windows clipboard, which
# is the tmux half of the bridge vimrc sets up for the "+ register. clip.exe
# reads its input in the console code page, so non-ASCII can be mangled;
# Set-Clipboard handles UTF-8 but costs roughly 70ms per call, and vimrc already
# made the same tradeoff.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'
# A mouse drag ends in copy-mode as well and needs the same pipe, otherwise the
# selection reaches the tmux buffer only.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'clip.exe'

# --- Pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-free variants
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# --- Pane resizing ---
# -r allows repeats within the repeat-time window, so a pane can be dragged to
# size with one prefix press followed by held keys.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window navigation ---
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pull a pane out of another window into this one.
bind @ command-prompt -p "create pane from:" "join-pane -s ':%%'"

# --- Prefix pass-through ---
# F12 drops every local binding so keys reach a tmux running over SSH, which is
# otherwise unreachable without a second prefix to remember. The off key-table
# keeps only the binding that restores things, so the status indicator below is
# the only signal that this mode is active.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  refresh-client -S

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# --- Gruvbox Material Dark palette ---
# bg0        #282828
# bg1/select #45403d
# fg         #d4be98
# muted      #7c6f64
# red        #ea6962
# yellow     #d8a657
# green      #a9b665
# blue       #7daea3
# aqua       #89b482
# purple     #d3869b

# --- Pane borders ---
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#89b482"

# --- Status bar ---
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#89b482,fg=#282828,bold] #S #[bg=#282828,fg=#89b482]"
set -g status-right "#{?#{==:#{client_key_table},off},#[bg=#ea6962,fg=#282828,bold] PREFIX OFF ,}#[fg=#7c6f64]#[bg=#45403d,fg=#d4be98] %Y-%m-%d #[fg=#d8a657,bold]%H:%M #[default]"

# --- Window list ---
setw -g window-status-format "#[fg=#7c6f64] #I:#W "
setw -g window-status-current-format "#[bg=#45403d,fg=#d8a657,bold] #I:#W "
setw -g window-status-activity-style "fg=#d8a657"   # matches monitor-activity above

# --- Messages and command prompt ---
set -g message-style "bg=#45403d,fg=#d4be98"
set -g message-command-style "bg=#45403d,fg=#d4be98"

# --- Clock mode ---
setw -g clock-mode-colour "#89b482"
