# ~/.config/tmux/tmux.conf
# tmux configuration. Theme: Gruvbox Material Dark.

# --- General behavior ---
set -g mouse on                      # select panes, resize by dragging, scroll natively
set -sg escape-time 10               # drop the ~500ms wait after Esc
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on           # closing a window closes the gap in the numbering
set -g focus-events on
set -g status-interval 5             # clock refresh, down from the default 15s

# --- Splits open in the current directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# --- Copy mode (vi keys) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-free variants
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# --- Gruvbox Material Dark palette ---
# bg0        #282828
# bg1/select #45403d
# fg         #d4be98
# muted      #7c6f64
# red        #ea6962
# yellow     #d8a657
# green      #a9b665
# blue       #7daea3
# aqua       #89b482
# purple     #d3869b

# --- Pane borders ---
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#89b482"

# --- Status bar ---
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#89b482,fg=#282828,bold] #S #[bg=#282828,fg=#89b482]"
set -g status-right "#[fg=#7c6f64]#[bg=#45403d,fg=#d4be98] %Y-%m-%d #[fg=#d8a657,bold]%H:%M #[default]"

# --- Window list ---
setw -g window-status-format "#[fg=#7c6f64] #I:#W "
setw -g window-status-current-format "#[bg=#45403d,fg=#d8a657,bold] #I:#W "

# --- Messages and command prompt ---
set -g message-style "bg=#45403d,fg=#d4be98"
set -g message-command-style "bg=#45403d,fg=#d4be98"

# --- Clock mode ---
setw -g clock-mode-colour "#89b482"
