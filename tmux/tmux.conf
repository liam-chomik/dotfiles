# ~/.config/tmux/tmux.conf
# Theme: Gruvbox Material Dark (matches Windows Terminal / bat / eza / starship)

# --- general behavior ---
set -g mouse on                      # click to select pane/window, drag to resize, scroll to scroll
set -sg escape-time 10               # don't wait ~500ms after Esc (kills Vim mode-switch lag)
set -g history-limit 10000
set -g base-index 1                  # windows start at 1, not 0 (0 is awkward to reach)
setw -g pane-base-index 1
set -g renumber-windows on           # close window 2 of 3 -> 3 becomes 2, no gaps
set -g focus-events on
set -g status-interval 5             # refresh status bar (clock) every 5s instead of default 15s

# --- keep pane splits in the current directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# --- vi-style copy mode + pane navigation ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ================= Gruvbox Material Dark =================
# bg0        #282828
# bg1/select #45403D
# fg         #d4be98
# muted      #7c6f64
# red        #ea6962
# yellow     #d8a657
# green      #a9b665
# blue       #7daea3
# aqua       #89b482
# purple     #d3869b

# --- pane borders ---
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#89b482"

# --- status bar ---
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#89b482,fg=#282828,bold] #S #[bg=#282828,fg=#89b482]"
set -g status-right "#[fg=#7c6f64]#[bg=#45403d,fg=#d4be98] %Y-%m-%d #[fg=#d8a657,bold]%H:%M #[default]"

# --- window list ---
setw -g window-status-format "#[fg=#7c6f64] #I:#W "
setw -g window-status-current-format "#[bg=#45403d,fg=#d8a657,bold] #I:#W "

# --- messages / command prompt ---
set -g message-style "bg=#45403d,fg=#d4be98"
set -g message-command-style "bg=#45403d,fg=#d4be98"

# --- clock mode ---
setw -g clock-mode-colour "#89b482"

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
